<div class="login-container">
  <img
    src="images/moneymotion-logo.png"
    alt="MoneyMotion Logo"
    class="logo"
  />

  <div class="login-form">
    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)">
      <div class="form-field">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" ngModel required />
      </div>

      <div class="form-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" ngModel required />
      </div>

      @if (authStore.error()) {
        <p class="error">{{ authStore.error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loginForm.invalid || authStore.loading()"
      >
        {{ authStore.loading() ? 'Logging in...' : 'Login' }}
      </button>
    </form>
  </div>
</div>
